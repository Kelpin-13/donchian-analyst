<!DOCTYPE html>
<html lang="en">
<head>
<base target="_top">
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  /* ---------- tokens: light ---------- */
  :root {
    color-scheme: light;
    --paper: #F3F5F8; --sheet: #FFFFFF; --inset: #F6F8FA; --ink: #111827; --graphite: #5B6675; --rule: #E3E8EE;
    --band: #DCE8F5; --long: #2A78D6; --stop: #D0394A; --ema: #EDA100;
    --good-bg: #E3F4EA; --good-fg: #17693F; --warn-bg: #FDF1D6; --warn-fg: #8A5A00;
    --bad-bg: #FCE4E6; --bad-fg: #A3202F; --none-bg: #EEF1F5; --none-fg: #3E4856;
    --glow: rgba(42, 120, 214, .10); --shadow: 0 1px 2px rgba(17, 24, 39, .04), 0 4px 16px rgba(17, 24, 39, .04);
    --num: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    --body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  /* ---------- tokens: dark (OS setting, unless the toggle says light) ---------- */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --paper: #0B0F14; --sheet: #131922; --inset: #0F141B; --ink: #E6EBF2; --graphite: #8A96A6; --rule: #232B37;
      --band: #1B2A3D; --long: #3987E5; --stop: #F06272; --ema: #C98500;
      --good-bg: #12301F; --good-fg: #6FD29A; --warn-bg: #33260A; --warn-fg: #F2C35B;
      --bad-bg: #3A1519; --bad-fg: #FF8C98; --none-bg: #1D2530; --none-fg: #B6C0CC;
      --glow: rgba(57, 135, 229, .14); --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --paper: #0B0F14; --sheet: #131922; --inset: #0F141B; --ink: #E6EBF2; --graphite: #8A96A6; --rule: #232B37;
    --band: #1B2A3D; --long: #3987E5; --stop: #F06272; --ema: #C98500;
    --good-bg: #12301F; --good-fg: #6FD29A; --warn-bg: #33260A; --warn-fg: #F2C35B;
    --bad-bg: #3A1519; --bad-fg: #FF8C98; --none-bg: #1D2530; --none-fg: #B6C0CC;
    --glow: rgba(57, 135, 229, .14); --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); color: var(--ink); }
  body { font: 400 15px/1.55 var(--body); -webkit-font-smoothing: antialiased; font-feature-settings: "cv11", "ss01"; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 20px 16px 64px; }
  @media (min-width: 700px) { .wrap { padding: 28px 28px 72px; } }

  /* ---------- header ---------- */
  .top { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; margin-bottom: 18px; }
  .brand { display: flex; align-items: center; gap: 10px; font: 700 17px/1 var(--body); letter-spacing: -.01em; }
  .brand .logo { width: 28px; height: 28px; border-radius: 8px; background: linear-gradient(135deg, var(--long), #7B61FF); display: grid; place-items: center; color: #fff; font: 700 13px/1 var(--mono); }
  .brand small { font: 500 11px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--graphite); padding: 4px 7px; border: 1px solid var(--rule); border-radius: 999px; }
  .top .spacer { flex: 1; }
  .status { display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: center; color: var(--graphite); font-size: 13px; width: 100%;
            background: var(--sheet); border: 1px solid var(--rule); border-radius: 12px; padding: 10px 14px; box-shadow: var(--shadow); margin-bottom: 14px; }
  .status strong { color: var(--ink); font: 600 15px/1 var(--body); }
  .status > span:nth-of-type(1) { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
  .status .spacer { flex: 1; }
  button { font: 500 13px var(--body); color: var(--ink); background: var(--sheet); border: 1px solid var(--rule); border-radius: 8px; padding: 6px 12px; cursor: pointer; transition: border-color .15s, background .15s; }
  button:hover { border-color: var(--graphite); }
  button:focus-visible { outline: 2px solid var(--long); outline-offset: 2px; }
  #theme { width: 34px; height: 34px; padding: 0; display: grid; place-items: center; font-size: 15px; }

  /* ---------- tabs: segmented control ---------- */
  .tabs { display: flex; gap: 4px; padding: 4px; background: var(--inset); border: 1px solid var(--rule); border-radius: 12px; overflow-x: auto; scrollbar-width: none; margin-bottom: 18px; width: fit-content; max-width: 100%; }
  .tabs::-webkit-scrollbar { display: none; }
  .tabs button { border: 0; background: transparent; border-radius: 8px; padding: 8px 16px; font: 600 14px var(--body); color: var(--graphite); white-space: nowrap; }
  .tabs button:hover { color: var(--ink); }
  .tabs button[aria-selected="true"] { color: var(--ink); background: var(--sheet); box-shadow: var(--shadow); }
  .tabs .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--stop); margin-left: 7px; vertical-align: 2px; box-shadow: 0 0 0 3px var(--bad-bg); }

  /* ---------- cards ---------- */
  h2 { font: 500 12px/1.2 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--graphite); margin: 0 0 14px; }
  section { background: var(--sheet); border: 1px solid var(--rule); border-radius: 14px; padding: 18px 20px; margin: 0 0 16px; box-shadow: var(--shadow); min-width: 0; overflow: hidden; }
  .muted { color: var(--graphite); }
  .small { font-size: 13px; }
  .pos { color: var(--good-fg); } .neg { color: var(--bad-fg); }
  .err { color: var(--bad-fg); }
  .loading, .empty { padding: 40px 24px; color: var(--graphite); max-width: 44em; background: var(--sheet); border: 1px dashed var(--rule); border-radius: 14px; }
  @media (prefers-reduced-motion: no-preference) { .loading { animation: pulse 1.6s ease-in-out infinite; } @keyframes pulse { 50% { opacity: .55; } } }
  .grid { display: grid; grid-template-columns: 1fr; gap: 0 16px; }
  @media (min-width: 900px) { .grid { grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); } }
  .facts { display: grid; grid-template-columns: auto 1fr; gap: 0; margin: 0; }
  .facts dt, .facts dd { padding: 7px 0; border-bottom: 1px solid var(--rule); }
  .facts dt:last-of-type, .facts dd:last-of-type { border-bottom: 0; }
  .facts dt { color: var(--graphite); font-size: 14px; }
  .facts dd { margin: 0; padding-left: 18px; text-align: right; font: 600 15px/1.4 var(--num); font-variant-numeric: tabular-nums; }
  .stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; margin: 16px 0 0; }
  .stat { background: var(--inset); border: 1px solid var(--rule); border-radius: 10px; padding: 12px 14px; }
  .stat .k { font: 500 11px/1.3 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--graphite); }
  .stat .v { font: 600 24px/1.25 var(--num); font-variant-numeric: tabular-nums; margin-top: 6px; letter-spacing: -.01em; }
  .chartbox { position: relative; height: 290px; }
  .chartbox.small { height: 180px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; font: 600 12px/1 var(--body); letter-spacing: .01em; padding: 5px 9px; border-radius: 999px; background: var(--none-bg); color: var(--none-fg); white-space: nowrap; }
  .chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: .85; }
  .chip.good { background: var(--good-bg); color: var(--good-fg); } .chip.warn { background: var(--warn-bg); color: var(--warn-fg); } .chip.bad { background: var(--bad-bg); color: var(--bad-fg); }
  .chip.big { font-size: 16px; padding: 9px 14px; }
  code { font: 12.5px/1.4 var(--mono); background: var(--inset); border: 1px solid var(--rule); padding: 1px 5px; border-radius: 5px; word-break: break-all; }

  /* ---------- tables ---------- */
  .tablewrap { overflow-x: auto; margin: 0 -20px -18px; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th { text-align: left; font: 500 11px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--graphite); padding: 10px 12px; white-space: nowrap; background: var(--inset); border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
  th:first-child, td:first-child { padding-left: 20px; } th:last-child, td:last-child { padding-right: 20px; }
  td { padding: 10px 12px; border-bottom: 1px solid var(--rule); vertical-align: top; }
  tbody tr:last-child td { border-bottom: 0; }
  tbody tr:hover td { background: var(--inset); }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  td.nowrap { white-space: nowrap; }
  td.wide { min-width: 18em; }

  /* ---------- live hero + gauge ---------- */
  .channel { background: radial-gradient(120% 140% at 0% 0%, var(--glow), transparent 60%), var(--sheet); border: 1px solid var(--rule); border-radius: 16px; padding: 24px 24px 18px; box-shadow: var(--shadow); margin-bottom: 16px; }
  .price { font: 700 clamp(40px, 8vw, 68px)/1 var(--num); font-variant-numeric: tabular-nums; letter-spacing: -.03em; }
  .verdict { font-size: 16px; max-width: 46em; margin: 10px 0 30px; color: var(--graphite); }
  .gauge { position: relative; height: 64px; margin: 0 6px; }
  .gauge .rail { position: absolute; left: 0; right: 0; top: 30px; height: 2px; border-radius: 2px; background: var(--rule); }
  .gauge .band { position: absolute; top: 18px; height: 26px; border-radius: 6px; background: var(--band); border-left: 2px solid var(--graphite); border-right: 2px solid var(--ink); }
  .mark { position: absolute; top: 12px; width: 2px; height: 38px; border-radius: 2px; transform: translateX(-1px); }
  .mark span { position: absolute; top: 42px; left: 50%; transform: translateX(-50%); white-space: nowrap; font: 500 11px/1.2 var(--mono); color: var(--graphite); }
  .mark.ema { background: var(--ema); }
  .mark.stop { background: var(--stop); } .mark.stop span { color: var(--bad-fg); }
  .gauge .dot { position: absolute; top: 22px; width: 18px; height: 18px; border-radius: 50%; background: var(--ink); border: 3px solid var(--sheet); transform: translateX(-9px); box-shadow: 0 0 0 1px var(--ink); }
  .gauge .dot.long { background: var(--long); box-shadow: 0 0 0 1px var(--long), 0 0 0 6px var(--glow); }
  .edge { position: absolute; top: -4px; font: 500 11px/1 var(--mono); color: var(--graphite); white-space: nowrap; }
  .edge.hi { transform: translateX(-100%); color: var(--ink); }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 20px; margin: 34px 6px 0; font-size: 13px; color: var(--graphite); }
  .sig { padding: 12px 0; border-bottom: 1px solid var(--rule); }
  .sig:first-of-type { padding-top: 0; }
  .sig:last-child { border-bottom: 0; padding-bottom: 0; }
  .sig .head { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .sig .type { font: 600 14px var(--body); display: inline-flex; align-items: center; gap: 7px; }
  .sig .type::before { content: ""; width: 8px; height: 8px; border-radius: 2px; background: currentColor; }
  .sig .type.entry { color: var(--long); } .sig .type.exit { color: var(--stop); }
  .sig p { margin: 6px 0 0; max-width: 62em; }
  .checks { list-style: none; padding: 0; margin: 14px 0 0; font-size: 14px; }
  .checks li { padding: 8px 0; border-bottom: 1px solid var(--rule); display: flex; gap: 12px; align-items: flex-start; }
  .checks li:last-child { border-bottom: 0; }
  .checks li .chip { min-width: 5em; justify-content: center; }
  .proposal { padding: 12px 0; border-bottom: 1px solid var(--rule); }
  @media (prefers-reduced-motion: no-preference) { .gauge .dot { transition: left .6s ease; } }
</style>
</head>
<body data-k="<?= k ?>" data-refresh="<?= refresh ?>">
<div class="wrap">
  <header class="top">
    <div class="brand"><span class="logo" aria-hidden="true">DA</span>Donchian Analyst <small>Paper research</small></div>
    <span class="spacer"></span>
    <button type="button" id="theme" aria-label="Switch light or dark theme" title="Switch theme">◐</button>
  </header>
  <div class="status" id="status"><strong>Loading…</strong></div>
  <nav class="tabs" role="tablist" aria-label="Panel sections">
    <button role="tab" data-tab="live" aria-selected="true">Live</button>
    <button role="tab" data-tab="paper" aria-selected="false">Paper</button>
    <button role="tab" data-tab="backtests" aria-selected="false">Backtests</button>
    <button role="tab" data-tab="lab" aria-selected="false">Lab</button>
    <button role="tab" data-tab="system" aria-selected="false">System</button>
  </nav>
  <div id="app" role="tabpanel"><p class="loading">Fetching the latest bar and your paper account.</p></div>
</div>

<script>
  const KEY = document.body.dataset.k;
  const REFRESH_S = Math.max(15, Number(document.body.dataset.refresh) || 60);
  const ENDPOINT = { live: 'getDashboardData', paper: 'getPaperData', backtests: 'getBacktestData', lab: 'getLabData', system: 'getSystemData' };
  const LOADING = { live: 'Fetching the latest bar and your paper account.', paper: 'Loading your paper account.',
    backtests: 'Loading backtest results.', lab: 'Loading the research lab.', system: 'Checking the system.' };
  let tab = 'live', live = null, liveAt = 0, cache = {}, charts = {}, checks = null;

  /* ---------- helpers ---------- */
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const isNum = v => v !== '' && v !== null && v !== undefined && !isNaN(Number(v));
  const money = v => !isNum(v) ? '—'
    : '$' + Number(v).toLocaleString('en-US', { maximumFractionDigits: Math.abs(v) >= 1000 ? 0 : 2, minimumFractionDigits: Math.abs(v) >= 1000 ? 0 : 2 });
  const pct = v => !isNum(v) ? '—' : (v > 0 ? '+' : '') + Number(v).toFixed(2) + '%';
  const num = (v, dp) => !isNum(v) ? '—' : Number(v).toFixed(dp === undefined ? 2 : dp);
  const cls = v => v > 0 ? 'pos' : v < 0 ? 'neg' : '';
  function dur(ms) { if (ms <= 0) return 'now'; const m = Math.floor(ms / 60000), h = Math.floor(m / 60); return h ? h + 'h ' + (m % 60) + 'm' : m + 'm'; }
  function ago(ms) { const m = Math.round(ms / 60000); return m < 1 ? 'just now' : m < 60 ? m + ' min ago' : Math.round(m / 60) + ' h ago'; }

  const TONE = { 'PASSES SO FAR': 'good', 'IMPROVES': 'good', 'MATCH': 'good', 'HOLDS UP': 'good', 'PASS': 'good', 'DONE': 'good', 'INFO': '',
    'PASSES WITH WARNINGS': 'warn', 'FRAGILE': 'warn', 'PENDING': 'warn', 'PROPOSED': 'warn', 'QUEUED': 'warn', 'RUNNING': 'warn', 'TODO': 'warn', 'WARN': 'warn', 'SIGNAL': 'good',
    'FAILS': 'bad', 'WORSE': 'bad', 'ERROR': 'bad', 'FAIL': 'bad', 'FAILS ON NEW DATA': 'bad', 'TV_ONLY': 'bad', 'APPS_SCRIPT_ONLY': 'bad' };
  const chip = (text, big) => text ? '<span class="chip ' + (TONE[String(text).toUpperCase()] || '') + (big ? ' big' : '') + '">' + esc(text) + '</span>' : '';

  /** Pick a column by header name so the panel survives column reordering. */
  function col(table, name) { return table.headers.indexOf(name); }
  function get(table, row, name) { const i = col(table, name); return i === -1 ? '' : row[i]; }

  function table(headers, rows) {
    return '<div class="tablewrap"><table><thead><tr>' +
      headers.map(h => '<th class="' + (h.num ? 'num' : '') + '">' + esc(h.label) + '</th>').join('') +
      '</tr></thead><tbody>' + rows.join('') + '</tbody></table></div>';
  }
  const td = (html, c) => '<td' + (c ? ' class="' + c + '"' : '') + '>' + html + '</td>';

  function chart(id, config) {
    if (!window.Chart) return;
    const el = document.getElementById(id);
    if (!el) return;
    if (charts[id]) charts[id].destroy();
    Chart.defaults.color = css('--graphite');
    Chart.defaults.borderColor = css('--rule');
    Chart.defaults.font.family = css('--body');
    Chart.defaults.font.size = 12;
    charts[id] = new Chart(el, config);
  }
  function clearCharts() { Object.keys(charts).forEach(k => { try { charts[k].destroy(); } catch (e) {} }); charts = {}; }
  function css(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
  function baseOpts(yFmt) {
    return { responsive: true, maintainAspectRatio: false, animation: false, interaction: { mode: 'index', intersect: false },
      plugins: { legend: { position: 'bottom', labels: { boxWidth: 14, boxHeight: 2, padding: 16 } },
                 tooltip: { backgroundColor: css('--sheet'), titleColor: css('--ink'), bodyColor: css('--ink'), borderColor: css('--rule'),
                            borderWidth: 1, padding: 10, cornerRadius: 8, boxPadding: 4, usePointStyle: true } },
      scales: { x: { grid: { display: false }, border: { color: css('--rule') }, ticks: { maxTicksLimit: 6, maxRotation: 0 } },
                y: { grid: { color: css('--rule') }, border: { display: false }, ticks: { callback: yFmt || (v => v) } } } };
  }

  /* ---------- loading ---------- */
  function load(which, quiet) {
    if (!quiet && !cache[which]) document.getElementById('app').innerHTML = '<p class="loading">' + LOADING[which] + '</p>';
    google.script.run
      .withSuccessHandler(d => {
        cache[which] = d;
        if (which === 'live') { live = d; liveAt = Date.now(); statusLine(); }
        if (which === tab) render();
      })
      .withFailureHandler(err => {
        const msg = err && err.message === 'Locked' ? 'This link is missing the right key. Use Show dashboard URL in the sheet menu to get it again.'
          : 'Couldn\'t load: ' + (err && err.message) + '. Retrying in ' + REFRESH_S + 's.';
        if (which === tab) document.getElementById('app').innerHTML = '<p class="empty err">' + esc(msg) + '</p>';
      })[ENDPOINT[which]](KEY);
  }

  function selectTab(t) {
    tab = t;
    document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === t)));
    clearCharts();
    if (cache[t]) render();
    load(t);
  }
  document.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => selectTab(b.dataset.tab)));

  function statusLine() {
    const d = live;
    if (!d) return;
    const now = Date.now() + (d.serverNow - liveAt);
    const since = Math.round((Date.now() - liveAt) / 1000);
    document.getElementById('status').innerHTML =
      '<strong>' + esc(d.symbol) + '</strong><span>' + money(d.price) + '</span>' +
      '<span>' + d.interval / 60 + 'h candles on ' + esc(d.provider) + '</span>' +
      '<span>Next bar closes in ' + dur(d.nextCloseAt - now) + '</span>' +
      '<span class="spacer"></span><span>Updated ' + (since < 5 ? 'just now' : since + 's ago') + '</span>' +
      '<button type="button" id="refresh">Refresh</button>';
    document.getElementById('refresh').onclick = () => { load('live', true); if (tab !== 'live') load(tab, true); };
    const sysBtn = document.querySelector('.tabs button[data-tab="system"]');
    const bad = (d.lastError) || (d.lastRun && (d.serverNow - d.lastRun) > 40 * 60000) || (d.cross && d.cross.disagree);
    sysBtn.innerHTML = 'System' + (bad ? '<span class="dot" title="Needs attention"></span>' : '');
  }

  function render() {
    const d = cache[tab];
    if (!d) return;
    clearCharts();
    ({ live: renderLive, paper: renderPaper, backtests: renderBacktests, lab: renderLab, system: renderSystem })[tab](d);
  }

  /* =================== LIVE =================== */
  function verdictText(d) {
    if (d.position === 'LONG') {
      const toStop = (d.price - d.stop) / d.price * 100, toExit = (d.price - d.lower) / d.price * 100;
      return 'Long for ' + d.barsInTrade + ' bar' + (d.barsInTrade === 1 ? '' : 's') + '. Price is ' + toStop.toFixed(1) +
        '% above the stop and ' + toExit.toFixed(1) + '% above the ' + d.exitLookback + '-bar exit line. Time stop in ' +
        Math.max(0, d.maxBars - d.barsInTrade) + ' bars.';
    }
    if (d.price <= d.ema) return 'Flat. Price is below the ' + d.emaPeriod + '-bar trend line, so breakouts are ignored until it climbs back above ' + money(d.ema) + '.';
    const gap = (d.upper - d.price) / d.price * 100;
    if (gap <= 0) return 'Flat, and price is above the breakout line right now. If this bar closes above ' + money(d.upper) + ', an entry signal fires.';
    return 'Flat. Price is ' + gap.toFixed(2) + '% below the ' + d.breakoutLookback + '-bar breakout line at ' + money(d.upper) + '.';
  }

  function gauge(d) {
    const pts = [d.lower, d.upper, d.price, d.ema].concat(d.position === 'LONG' && d.stop ? [d.stop] : []);
    let lo = Math.min.apply(null, pts), hi = Math.max.apply(null, pts);
    const pad = (hi - lo) * 0.08 || hi * 0.01; lo -= pad; hi += pad;
    const x = v => ((v - lo) / (hi - lo) * 100).toFixed(2) + '%';
    const L = (d.lower - lo) / (hi - lo) * 100, R = (d.upper - lo) / (hi - lo) * 100;
    return '<div class="gauge" role="img" aria-label="Price ' + money(d.price) + ' between exit line ' + money(d.lower) + ' and breakout line ' + money(d.upper) + '">' +
      '<div class="rail"></div><div class="band" style="left:' + L + '%;width:' + (R - L) + '%"></div>' +
      '<div class="edge" style="left:' + x(d.lower) + '">Exit ' + money(d.lower) + '</div>' +
      '<div class="edge hi" style="left:' + x(d.upper) + '">Breakout ' + money(d.upper) + '</div>' +
      '<div class="mark ema" style="left:' + x(d.ema) + '"><span>Trend ' + money(d.ema) + '</span></div>' +
      (d.position === 'LONG' && d.stop ? '<div class="mark stop" style="left:' + x(d.stop) + '"><span>Stop ' + money(d.stop) + '</span></div>' : '') +
      '<div class="dot' + (d.position === 'LONG' ? ' long' : '') + '" style="left:' + x(d.price) + '"></div></div>';
  }

  function renderLive(d) {
    const p = d.paper;
    const label = { ENTRY_LONG: 'Entry', EXIT_STOP: 'Stopped out', EXIT_CHANNEL: 'Exit on channel', EXIT_TIME: 'Time exit' };
    const sigs = d.signals.length ? d.signals.map(s => {
      const entry = s.type === 'ENTRY_LONG';
      return '<div class="sig"><div class="head"><span class="type ' + (entry ? 'entry' : 'exit') + '">' + esc(label[s.type] || s.type) + '</span>' +
        '<span class="muted">' + esc(s.time) + '</span><span>' + money(s.price) + '</span>' + (s.verdict ? chip(s.verdict.replace('_', ' ')) : '') + '</div>' +
        (entry && s.setup ? '<p>' + esc(s.setup) + '</p>' : '') + (s.lesson ? '<p class="muted small">Lesson: ' + esc(s.lesson) + '</p>' : '') + '</div>';
    }).join('') : '<p class="muted">No signals yet. This strategy fires a few times a month; each one appears here with the agent\'s note.</p>';

    document.getElementById('app').innerHTML =
      '<div class="channel"><div class="price">' + money(d.price) + (d.priceSource === 'live' ? '' : ' <span class="muted small">(last close)</span>') + '</div>' +
      '<p class="verdict">' + esc(verdictText(d)) + '</p>' + gauge(d) +
      '<div class="legend"><span>Shaded band: the ' + d.exitLookback + '-bar low to the ' + d.breakoutLookback + '-bar high</span>' +
      '<span>ATR ' + money(d.atr) + ' (' + (d.atr / d.price * 100).toFixed(2) + '% of price)</span></div></div>' +
      '<div class="grid"><div>' +
        '<section><h2>Price and channel, last 120 bars</h2><div class="chartbox"><canvas id="pc" aria-label="Price chart"></canvas></div></section>' +
        '<section><h2>Recent signals</h2>' + sigs + '</section>' +
      '</div><div>' +
        '<section><h2>' + (d.position === 'LONG' ? 'Open position' : 'No open position') + '</h2><dl class="facts">' +
        (d.position === 'LONG'
          ? '<dt>Signal entry</dt><dd>' + money(d.entry) + '</dd><dt>Stop</dt><dd class="neg">' + money(d.stop) + '</dd><dt>Open P&amp;L</dt><dd class="' + cls(p.openPnl) + '">' + money(p.openPnl) + '</dd><dt>Bars held</dt><dd>' + d.barsInTrade + ' of ' + d.maxBars + '</dd>'
          : '<dt>Waiting for</dt><dd>Close above ' + money(d.upper) + '</dd><dt>Trend filter</dt><dd class="' + (d.price > d.ema ? 'pos' : 'neg') + '">' + (d.price > d.ema ? 'Longs allowed' : 'Longs blocked') + '</dd>') +
        '</dl></section>' +
        (d.brief ? '<section><h2>Today\'s brief, ' + esc(d.brief.date) + '</h2><p style="margin:0 0 8px">' + esc(d.brief.summary) + '</p>' + (d.brief.risk ? '<p class="muted small" style="margin:0">' + esc(d.brief.risk) + '</p>' : '') + '</section>' : '') +
        '<section><h2>Paper account</h2><dl class="facts"><dt>Equity</dt><dd>' + money(p.equity) + '</dd><dt>Since start</dt><dd class="' + cls(p.returnPct) + '">' + pct(p.returnPct) + '</dd></dl>' +
        '<p class="small muted" style="margin:10px 0 0">Full detail in the Paper tab.</p></section>' +
      '</div></div>';

    chart('pc', { type: 'line', data: { labels: d.chart.labels, datasets: [
      { label: 'Exit line', data: d.chart.lower, borderColor: css('--graphite'), borderWidth: 1, pointRadius: 0, stepped: true },
      { label: 'Breakout line', data: d.chart.upper, borderColor: css('--ink'), borderWidth: 1, pointRadius: 0, stepped: true, fill: '-1', backgroundColor: css('--band') + 'AA' },
      { label: 'Trend EMA', data: d.chart.ema, borderColor: css('--ema'), borderWidth: 1.5, pointRadius: 0 },
      { label: 'Close', data: d.chart.close, borderColor: css('--long'), borderWidth: 2, pointRadius: 0 } ] },
      options: baseOpts(v => '$' + Number(v).toLocaleString()) });
  }

  /* =================== PAPER =================== */
  function renderPaper(d) {
    if (!d.enabled) { document.getElementById('app').innerHTML = '<p class="empty">The paper account is switched off (PAPER.enabled in Config.gs).</p>'; return; }
    const f = d.fills;
    const rows = f.rows.map(r => {
      const pnl = get(f, r, 'P&L$'), side = get(f, r, 'Side');
      return '<tr>' + td(esc(get(f, r, 'Time')), 'nowrap') + td(chip(side === 'BUY' ? 'Buy' : side === 'SELL' ? 'Sell' : side)) +
        td(esc(String(get(f, r, 'Signal')).replace('ENTRY_LONG', 'Entry').replace('EXIT_', 'Exit: ').toLowerCase().replace(/^\w/, c => c.toUpperCase())), 'nowrap') +
        td(money(get(f, r, 'FillPrice')), 'num') + td(num(get(f, r, 'Units'), 6), 'num') +
        td(pnl === '' ? '—' : '<span class="' + cls(pnl) + '">' + money(pnl) + '</span>', 'num') +
        td(get(f, r, 'P&L%acct') === '' ? '—' : pct(get(f, r, 'P&L%acct')), 'num') + td(esc(get(f, r, 'Note')), 'wide small muted') + '</tr>';
    });

    document.getElementById('app').innerHTML =
      '<section><h2>Paper account</h2><div class="stats">' +
        stat('Equity', money(d.equity)) + stat('Since start', '<span class="' + cls(d.returnPct) + '">' + pct(d.returnPct) + '</span>') +
        stat('Drawdown from peak', d.drawdownPct ? '<span class="neg">−' + num(d.drawdownPct) + '%</span>' : '0%') +
        stat('Closed trades', d.trades + (d.winRate !== null ? ' <span class="muted small">(' + num(d.winRate, 0) + '% won)</span>' : '')) +
        stat('Open position', d.units > 0 ? '<span class="' + cls(d.openPnl) + '">' + money(d.openPnl) + '</span>' : 'None') +
        stat('Fees paid', money(d.fees)) + '</div>' +
        '<p class="small muted" style="margin:14px 0 0">Started ' + esc(d.startedAt) + ' with ' + money(d.start) + '. Every fill uses the live price plus ' +
        d.slippagePct + '% slippage and a ' + d.feePct + '% fee, like a real account.</p></section>' +
      challengerHtml(d.challenger) +
      '<section><h2>Equity</h2>' + (d.curve.length ? '<div class="chartbox"><canvas id="eq" aria-label="Paper equity chart"></canvas></div>'
        : '<p class="muted">The equity line starts after the first closed 4-hour bar.</p>') + '</section>' +
      '<section><h2>Fills</h2>' + (rows.length ? table([{ label: 'Time' }, { label: 'Side' }, { label: 'Signal' }, { label: 'Fill', num: 1 }, { label: 'Units', num: 1 },
        { label: 'P&L', num: 1 }, { label: '% of account', num: 1 }, { label: 'Note' }], rows)
        : '<p class="muted">No fills yet. The first one appears when the strategy signals an entry.</p>') + '</section>';

    if (d.curve.length) chart('eq', { type: 'line', data: { labels: d.curve.map(x => x.t), datasets: [
      { label: 'Equity', data: d.curve.map(x => x.v), borderColor: css('--ink'), borderWidth: 1.5, pointRadius: 0 },
      { label: 'Starting balance', data: d.curve.map(() => d.start), borderColor: css('--rule'), borderWidth: 1, borderDash: [4, 4], pointRadius: 0 } ] },
      options: baseOpts(v => '$' + Number(v).toLocaleString()) });
  }
  function challengerHtml(c) {
    if (!c) return '';
    const row = (x, extra) => '<tr>' + td(esc(x.label)) + td(x.returnPct === null ? '—' : '<span class="' + cls(x.returnPct) + '">' + pct(x.returnPct) + '</span>', 'num') +
      td(esc(x.position || ''), 'nowrap') + extra + '</tr>';
    const ch = c.challenger;
    return '<section><h2>Current vs challenger — ' + num(c.days, 1) + ' days</h2>' +
      table([{ label: 'Account' }, { label: 'Return', num: 1 }, { label: 'Now' }, { label: 'Trades', num: 1 }, { label: 'Won', num: 1 },
             { label: 'Worst drop', num: 1 }, { label: 'Fees', num: 1 }], [
        row(c.live, td('—', 'num') + td('—', 'num') + td('—', 'num') + td('—', 'num')),
        row(ch, td(esc(ch.trades), 'num') + td(ch.winRate === null ? '—' : num(ch.winRate, 0) + '%', 'num') +
              td(num(ch.drawdownPct, 1) + '%', 'num') + td(money(ch.fees), 'num')),
        '<tr>' + td('<span class="muted">Buy &amp; hold BTC</span>') + td(pct(c.buyHoldPct), 'num') + td('') + td('') + td('') + td('') + td('') + '</tr>']) +
      '</section>';
  }
  const stat = (k, v) => '<div class="stat"><div class="k">' + k + '</div><div class="v">' + v + '</div></div>';

  /* =================== BACKTESTS =================== */
  function renderBacktests(d) {
    const L = d.log;
    if (!L.rows.length) {
      document.getElementById('app').innerHTML = '<p class="empty">No weekly backtest yet. In the spreadsheet: Trading Agent → Backtesting → Run the full automatic backtest now. After that it runs every Sunday by itself.</p>';
      return;
    }
    const r0 = L.rows[0], g = n => get(L, r0, n);
    const errors = g('Errors');
    const hist = L.rows.map(r => '<tr>' + td(esc(get(L, r, 'Run at')), 'nowrap') + td(chip(get(L, r, 'Verdict'))) +
      td(esc(get(L, r, 'Trades')), 'num') + td(pct(get(L, r, 'Return %')), 'num') + td(pct(get(L, r, 'Buy & hold %')), 'num') +
      td(num(get(L, r, 'Max DD %')) + '%', 'num') + td(num(get(L, r, 'Profit factor')), 'num') + td(isNum(get(L, r, 'WFE %')) ? num(get(L, r, 'WFE %'), 0) + '%' : '—', 'num') +
      td(isNum(get(L, r, 'MC 95th pct DD %')) ? num(get(L, r, 'MC 95th pct DD %'), 1) + '%' : '—', 'num') + '</tr>');

    document.getElementById('app').innerHTML =
      '<section><div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap">' + chip(g('Verdict'), true) +
        '<span class="muted">Latest weekly backtest, ' + esc(g('Run at')) + '</span></div>' +
        '<p style="margin:12px 0 0;max-width:52em">' + esc(g('Reasons')) + '</p>' +
        '<div class="stats">' +
          stat('Trades tested', esc(g('Trades'))) +
          stat('Return', '<span class="' + cls(g('Return %')) + '">' + pct(g('Return %')) + '</span>') +
          stat('Buy &amp; hold', pct(g('Buy & hold %'))) +
          stat('Max drawdown', num(g('Max DD %')) + '%') +
          stat('Profit factor', num(g('Profit factor'))) +
          stat('Unseen-data return', isNum(g('WF fixed %')) ? pct(g('WF fixed %')) : '—') +
          stat('Walk-forward efficiency', isNum(g('WFE %')) ? num(g('WFE %'), 0) + '%' : '—') +
          stat('Plan for drawdown', isNum(g('MC 95th pct DD %')) ? num(g('MC 95th pct DD %'), 1) + '%' : '—') +
        '</div>' +
        '<p class="small muted" style="margin:14px 0 0">' + esc(g('History bars')) + ' bars, ' + esc(String(g('From (UTC)')).slice(0, 11)) + ' to ' +
        esc(String(g('To (UTC)')).slice(0, 11)) + '. Breakout ' + esc(g('Breakout')) + ', stop ' + esc(g('Stop x ATR')) + '× ATR, fee ' + esc(g('Fee %')) +
        '%, slippage ' + esc(g('Slippage %')) + '%.' + (g('Promoted lab settings') ? ' Promoted lab settings: <code>' + esc(g('Promoted lab settings')) + '</code>' : '') + '</p>' +
        (errors ? '<p class="small err" style="margin:8px 0 0">Stages with problems: ' + esc(errors) + '</p>' : '') + '</section>' +
      (d.curve ? '<section><h2>Equity: strategy vs buy &amp; hold</h2><div class="chartbox"><canvas id="bt" aria-label="Backtest equity"></canvas></div>' +
        '<h2 style="margin-top:22px">Drawdown</h2><div class="chartbox small"><canvas id="dd" aria-label="Backtest drawdown"></canvas></div></section>' : '') +
      '<section><h2>Every weekly run</h2><p class="small muted" style="margin:-4px 0 12px">A verdict that keeps changing colour from week to week is fragile, whatever this week says.</p>' +
        table([{ label: 'Run' }, { label: 'Verdict' }, { label: 'Trades', num: 1 }, { label: 'Return', num: 1 }, { label: 'Buy & hold', num: 1 },
          { label: 'Max DD', num: 1 }, { label: 'PF', num: 1 }, { label: 'WFE', num: 1 }, { label: 'Plan-for DD', num: 1 }], hist) + '</section>';

    if (d.curve) {
      chart('bt', { type: 'line', data: { labels: d.curve.labels, datasets: [
        { label: 'Strategy', data: d.curve.strat, borderColor: css('--long'), borderWidth: 2, pointRadius: 0 },
        { label: 'Buy & hold', data: d.curve.hold, borderColor: css('--graphite'), borderWidth: 1, pointRadius: 0 } ] },
        options: baseOpts(v => '$' + Number(v).toLocaleString()) });
      const o = baseOpts(v => v + '%'); o.plugins.legend = { display: false };
      chart('dd', { type: 'line', data: { labels: d.curve.labels, datasets: [
        { data: d.curve.dd, borderColor: css('--stop'), backgroundColor: css('--stop') + '22', fill: 'origin', borderWidth: 1, pointRadius: 0 } ] }, options: o });
    }
  }

  /* =================== LAB =================== */
  function renderLab(d) {
    const Q = d.queue, G = d.log;
    const statusOf = r => String(get(Q, r, 'Status')).toUpperCase();
    const count = s => Q.rows.filter(r => statusOf(r) === s).length;
    const proposed = Q.rows.filter(r => statusOf(r) === 'PROPOSED');
    let promoted = '';
    try { promoted = d.live ? JSON.stringify(JSON.parse(d.live)) : ''; } catch (e) { promoted = d.live; }

    const props = proposed.length ? proposed.map(r => '<div class="proposal"><div style="display:flex;gap:10px;align-items:baseline;flex-wrap:wrap"><strong>' +
      esc(get(Q, r, 'Name')) + '</strong><code>' + esc(get(Q, r, 'Overrides (JSON)')) + '</code></div>' +
      '<p class="small" style="margin:4px 0 0">' + esc(get(Q, r, 'Why')) + '</p></div>').join('') +
      '<p class="small muted" style="margin:12px 0 0">To run one, change its Status to <code>QUEUED</code> in the Lab_Queue sheet. If the reasoning doesn\'t convince you, delete the row.</p>'
      : '<p class="muted">Nothing waiting for you. Claude\'s suggestions appear here after each Sunday backtest.</p>';

    const results = G.rows.map(r => '<tr>' + td(esc(get(G, r, 'ID')), 'nowrap') + td(esc(get(G, r, 'Name'))) + td(chip(get(G, r, 'Verdict'))) +
      td(esc(get(G, r, 'Blocks won')), 'num') + td(esc(get(G, r, 'Neighbours OK')), 'num') +
      td(get(G, r, 'Holdout verdict') ? chip(get(G, r, 'Holdout verdict')) : '<span class="muted">—</span>') +
      td(get(G, r, 'Promoted') ? chip('PROMOTED') : '') + td(esc(get(G, r, 'Reasons')), 'wide small muted') + '</tr>');

    document.getElementById('app').innerHTML =
      '<section><h2>Live strategy</h2><dl class="facts">' +
        '<dt>Running</dt><dd>' + (promoted ? 'Config.gs + promoted changes' : 'Config.gs defaults') + '</dd>' +
        (promoted ? '<dt>Promoted changes</dt><dd><code>' + esc(promoted) + '</code></dd>' : '') +
        '<dt>Breakout / exit</dt><dd>' + d.strategy.breakoutLookback + ' / ' + d.strategy.exitLookback + ' bars</dd>' +
        '<dt>Stop</dt><dd>' + d.strategy.stopAtrMult + '× ATR</dd><dt>Trend filter</dt><dd>' + d.strategy.trendEmaPeriod + '-bar EMA</dd>' +
        '<dt>Experiments tried so far</dt><dd>' + d.tried + '</dd>' +
        '<dt>Holdout year used</dt><dd class="' + (d.holdoutUses > 3 ? 'neg' : '') + '">' + d.holdoutUses + (d.holdoutUses === 1 ? ' time' : ' times') + '</dd>' +
      '</dl><p class="small muted" style="margin:12px 0 0">Promoting and reverting stay in the spreadsheet menu (Trading Agent → Lab), where your Google login protects them.</p></section>' +
      '<section><h2>Waiting for you' + (proposed.length ? ' (' + proposed.length + ')' : '') + '</h2>' + props + '</section>' +
      '<section><h2>Queue</h2><p style="margin:0">' + chip(count('QUEUED') + ' queued') + ' ' + chip(count('DONE') + ' done') +
        (count('ERROR') ? ' ' + chip(count('ERROR') + ' error') : '') +
        (count('QUEUED') ? ' <span class="small muted">Next run ' + (d.runHour === null ? 'tonight' : 'at ' + String(d.runHour).padStart(2, '0') + ':00') + '.</span>' : '') + '</p></section>' +
      '<section><h2>Results</h2>' + (results.length
        ? '<p class="small muted" style="margin:-4px 0 12px">Most experiments fail. That\'s the lab protecting you from settings that only fit the past.</p>' +
          table([{ label: 'ID' }, { label: 'Experiment' }, { label: 'Verdict' }, { label: 'Blocks', num: 1 }, { label: 'Neighbours', num: 1 },
            { label: 'Holdout' }, { label: '' }, { label: 'Why' }], results)
        : '<p class="muted">No experiments run yet. In the spreadsheet: Trading Agent → Lab → Add starter experiments.</p>') + '</section>';
  }

  /* =================== SYSTEM =================== */
  function renderSystem(d) {
    const since = d.lastRun ? d.serverNow - d.lastRun : null;
    const want = ['runMonitor', 'runDailyBrief', 'runGrader', 'runAutoBacktest', 'runLab'].concat(d.challengerOn ? ['runChallenger'] : []);
    const missing = want.filter(t => d.triggers.indexOf(t) === -1);
    const L = d.log;
    const logRows = L.rows.map(r => '<tr>' + td(esc(get(L, r, 'Time')), 'nowrap') + td(chip(get(L, r, 'Level'))) + td(esc(get(L, r, 'Message')), 'wide') + '</tr>');

    let cross = '';
    if (d.cross) {
      const C = d.cross;
      cross = '<section><h2>TradingView cross-check</h2>' + (C.rows.length ? table([{ label: 'Signal' }, { label: 'Bar (UTC)' }, { label: 'Status' }, { label: 'Note' }],
        C.rows.map(r => '<tr>' + td(esc(get(C, r, 'Type'))) + td(esc(get(C, r, 'BarTime (UTC)')), 'nowrap') + td(chip(get(C, r, 'Status'))) + td(esc(get(C, r, 'Note')), 'small muted') + '</tr>'))
        : '<p class="muted">No signals to compare yet.</p>') + '</section>';
    }

    document.getElementById('app').innerHTML =
      '<div class="grid"><div>' +
        '<section><h2>Health</h2><dl class="facts">' +
          '<dt>Monitor</dt><dd class="' + (since === null || since > 40 * 60000 ? 'neg' : '') + '">' + (since === null ? 'never run' : 'ran ' + ago(since)) + '</dd>' +
          '<dt>Scheduled jobs</dt><dd class="' + (missing.length ? 'neg' : '') + '">' + (missing.length ? 'missing: ' + esc(missing.join(', ')) : 'all ' + want.length + ' installed') + '</dd>' +
          '<dt>Market</dt><dd>' + esc(d.provider) + ' ' + esc(d.symbol) + ', ' + d.interval / 60 + 'h</dd>' +
          '<dt>Claude model</dt><dd>' + esc(d.model) + (d.agent ? ', agent on' : '') + '</dd>' +
          '<dt>Alerts</dt><dd>' + [d.emailOn ? 'email' : '', d.telegramOn ? 'Telegram' : ''].filter(Boolean).join(' + ') + (d.emailOn || d.telegramOn ? '' : '<span class="neg">none set</span>') + '</dd>' +
          '<dt>TradingView cross-check</dt><dd>' + (d.tvEnabled ? 'on' : 'off') + '</dd>' +
        '</dl>' + (missing.length ? '<p class="small err" style="margin:10px 0 0">Run setup once from the Apps Script editor to reinstall the missing jobs.</p>' : '') + '</section>' +
        '<section><h2>Recent log</h2>' + (logRows.length ? table([{ label: 'Time' }, { label: 'Level' }, { label: 'Message' }], logRows) : '<p class="muted">Nothing logged yet.</p>') + '</section>' +
      '</div><div>' +
        '<section><h2>Installation check</h2><p class="small muted" style="margin:0 0 10px">Checks every file, secret and connection. The Claude API test is skipped here to save cost.</p>' +
          '<button type="button" id="runchecks">Run check</button><div id="checkout">' + checksHtml() + '</div></section>' + cross +
      '</div></div>';

    document.getElementById('runchecks').onclick = () => {
      document.getElementById('checkout').innerHTML = '<p class="muted small">Checking…</p>';
      google.script.run.withSuccessHandler(lines => { checks = lines; document.getElementById('checkout').innerHTML = checksHtml(); })
        .withFailureHandler(e => { document.getElementById('checkout').innerHTML = '<p class="err small">' + esc(e.message) + '</p>'; })
        .runPanelChecks(KEY);
    };
  }

  function checksHtml() {
    if (!checks) return '';
    return '<ul class="checks">' + checks.map(l => {
      const m = String(l).match(/^(\w+)\s+(.*)$/) || ['', '', l];
      return '<li>' + chip(m[1]) + '<span>' + esc(m[2]) + '</span></li>';
    }).join('') + '</ul>';
  }

  /* ---------- theme: OS setting by default, the button overrides it ---------- */
  const darkOS = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
  function setTheme(t) {
    if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    else delete document.documentElement.dataset.theme;
  }
  try { setTheme(localStorage.getItem('da-theme')); } catch (e) {}
  document.getElementById('theme').onclick = () => {
    const cur = document.documentElement.dataset.theme || (darkOS && darkOS.matches ? 'dark' : 'light');
    const next = cur === 'dark' ? 'light' : 'dark';
    setTheme(next);
    try { localStorage.setItem('da-theme', next); } catch (e) {}
    render();   // charts read their colours from the tokens
  };
  if (darkOS && darkOS.addEventListener) darkOS.addEventListener('change', render);

  /* ---------- start ---------- */
  load('live');
  setInterval(() => { load('live', true); if (tab !== 'live' && tab !== 'system') load(tab, true); }, REFRESH_S * 1000);
  setInterval(statusLine, 1000);
</script>
</body>
</html>
